<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="asphaltBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
    <!-- Fresh bituminous compaction patch -->
    <radialGradient id="freshPatch" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>
    <linearGradient id="yellowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Pavement Base -->
  <rect width="800" height="450" fill="url(#asphaltBase)" />

  <!-- Road Lane Line -->
  <rect x="710" y="0" width="18" height="450" fill="url(#yellowLine)" opacity="0.85" />
  <rect x="60" y="0" width="12" height="120" fill="#ffffff" opacity="0.8" />
  <rect x="60" y="170" width="12" height="120" fill="#ffffff" opacity="0.8" />
  <rect x="60" y="320" width="12" height="120" fill="#ffffff" opacity="0.8" />

  <!-- Bitumen Tack-Coat Border Seal (Rectangular/Oval Remediation Cut) -->
  <rect x="240" y="140" width="320" height="210" rx="20" fill="none" stroke="#09090b" stroke-width="8" opacity="0.9" />

  <!-- Fresh Asphalt Mechanical Compactor Roller Patch -->
  <rect x="245" y="145" width="310" height="200" rx="16" fill="url(#freshPatch)" />

  <!-- Roller Compaction Stripe Marks (smooth planar surface) -->
  <rect x="250" y="160" width="300" height="40" fill="#27272a" opacity="0.15" />
  <rect x="250" y="210" width="300" height="40" fill="#27272a" opacity="0.12" />
  <rect x="250" y="260" width="300" height="40" fill="#27272a" opacity="0.15" />

  <!-- Polymer Emulsion Edge Sealing Joint -->
  <rect x="242" y="142" width="316" height="206" rx="18" fill="none" stroke="#000000" stroke-width="2.5" />

  <!-- Verification Compliance Badge Overlay -->
  <g transform="translate(290, 205)">
    <rect width="220" height="80" rx="10" fill="#064e3b" fill-opacity="0.9" stroke="#10b981" stroke-width="2" />
    <circle cx="35" cy="40" r="18" fill="#10b981" />
    <path d="M 27,40 L 33,46 L 44,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="34" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">REMEDIATION COMPLETE</text>
    <text x="65" y="50" font-family="monospace" font-size="10" fill="#6ee7b7">DENSE BC OVERLAY: 40mm</text>
    <text x="65" y="65" font-family="monospace" font-size="10" fill="#a7f3d0">FLUSH LEVEL: ±2mm IRC COMPLIANT</text>
  </g>

  <!-- Watermark / Demo Evidence Label -->
  <g transform="translate(20, 20)">
    <rect width="360" height="30" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399">
      AFTER REPAIR EVIDENCE • CONTRACTOR REMEDIATION
    </text>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(20, 410)">
    <rect width="540" height="26" rx="5" fill="#020617" fill-opacity="0.85" />
    <text x="12" y="18" font-family="monospace" font-size="11" fill="#94a3b8">
      COMPLETED BY: M/S MEERUT INFRA BUILDERS • QUALITY SIGN-OFF AUDIT READY
    </text>
  </g>
</svg>
