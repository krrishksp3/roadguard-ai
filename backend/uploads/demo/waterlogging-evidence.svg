<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="asphaltGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
    <radialGradient id="waterSurface" cx="48%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="80%" stop-color="#1e3a8a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="curbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Pavement Base -->
  <rect width="800" height="450" fill="url(#asphaltGradient)" />

  <!-- Road Curb on top -->
  <rect x="0" y="40" width="800" height="30" fill="url(#curbGradient)" />
  <line x1="0" y1="70" x2="800" y2="70" stroke="#0f172a" stroke-width="2" />

  <!-- Submerged Lane Lines -->
  <rect x="100" y="320" width="120" height="14" fill="#ffffff" opacity="0.4" />
  <rect x="340" y="320" width="120" height="14" fill="#ffffff" opacity="0.3" />
  <rect x="580" y="320" width="120" height="14" fill="#ffffff" opacity="0.5" />

  <!-- Large Waterlogging Pond Area -->
  <path d="M 120,130 C 240,90 480,95 680,120 C 760,170 780,260 710,330 C 620,400 320,410 180,360 C 90,320 60,220 120,130 Z" fill="url(#waterSurface)" />

  <!-- Water Reflections & Ripples -->
  <ellipse cx="400" cy="230" rx="220" ry="60" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.4" />
  <ellipse cx="420" cy="240" rx="160" ry="40" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.5" />
  <ellipse cx="380" cy="220" rx="100" ry="25" fill="none" stroke="#bfdbfe" stroke-width="1.8" opacity="0.6" />
  <ellipse cx="460" cy="210" rx="60" ry="15" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.7" />

  <!-- Submerged Hazard Outline Indicator -->
  <circle cx="340" cy="240" r="32" fill="#0f172a" opacity="0.5" />
  <circle cx="340" cy="240" r="32" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="340" y="244" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">CONCEALED HOLE</text>

  <!-- High Water Depth Marker Post -->
  <g transform="translate(620, 180)">
    <rect x="10" y="0" width="16" height="130" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <rect x="10" y="20" width="16" height="15" fill="#ef4444" />
    <rect x="10" y="50" width="16" height="15" fill="#ef4444" />
    <rect x="10" y="80" width="16" height="15" fill="#ef4444" />
    <text x="34" y="90" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171">WATER DEPTH: ~28cm</text>
  </g>

  <!-- Watermark / Demo Evidence Label -->
  <g transform="translate(20, 20)">
    <rect width="360" height="30" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">
      DEMO EVIDENCE • ROAD DISTRESS TEST CASE
    </text>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(20, 410)">
    <rect width="530" height="26" rx="5" fill="#020617" fill-opacity="0.85" />
    <text x="12" y="18" font-family="monospace" font-size="11" fill="#94a3b8">
      LOC: 28.9140° N, 77.6580° E • BIJAULI LINK CORRIDOR • SEVERE WATERLOGGING
    </text>
  </g>
</svg>
