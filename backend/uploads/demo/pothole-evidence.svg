<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Road Surface Texture Pattern -->
    <radialGradient id="asphaltGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
    <radialGradient id="potholeDepth" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>
    <linearGradient id="yellowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <pattern id="roadGrain" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.5" fill="#4b5563" opacity="0.3" />
      <circle cx="24" cy="6" r="1" fill="#6b7280" opacity="0.25" />
      <circle cx="32" cy="28" r="1.8" fill="#374151" opacity="0.4" />
      <circle cx="16" cy="34" r="1.2" fill="#4b5563" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Pavement Base -->
  <rect width="800" height="450" fill="url(#asphaltGradient)" />
  <rect width="800" height="450" fill="url(#roadGrain)" />

  <!-- Road Lane Line -->
  <rect x="710" y="0" width="18" height="450" fill="url(#yellowLine)" opacity="0.85" />
  <rect x="60" y="0" width="12" height="120" fill="#ffffff" opacity="0.8" />
  <rect x="60" y="170" width="12" height="120" fill="#ffffff" opacity="0.8" />
  <rect x="60" y="320" width="12" height="120" fill="#ffffff" opacity="0.8" />

  <!-- Surrounding asphalt wear and micro-cracks -->
  <path d="M 210,180 Q 260,165 310,190 T 360,170" stroke="#111827" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 450,150 Q 480,180 540,160" stroke="#111827" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 330,310 Q 380,340 440,320 T 500,335" stroke="#111827" stroke-width="2.5" fill="none" opacity="0.7" />

  <!-- Main Pothole Crater -->
  <!-- Outer ragged edge shadow -->
  <path d="M 270,165 C 330,140 440,145 510,180 C 560,210 575,260 530,305 C 480,350 360,355 290,325 C 240,295 230,225 270,165 Z" fill="#090d16" opacity="0.9" />
  <!-- Inner crater depth -->
  <path d="M 285,175 C 340,155 435,158 495,190 C 540,215 550,255 515,295 C 470,335 365,340 305,315 C 255,290 250,230 285,175 Z" fill="url(#potholeDepth)" />

  <!-- Subbase loose aggregate stones inside pothole -->
  <circle cx="340" cy="230" r="8" fill="#64748b" />
  <circle cx="360" cy="245" r="11" fill="#475569" />
  <circle cx="395" cy="225" r="9" fill="#94a3b8" />
  <circle cx="430" cy="250" r="14" fill="#334155" />
  <circle cx="455" cy="235" r="7" fill="#64748b" />
  <circle cx="380" cy="270" r="12" fill="#475569" />
  <circle cx="415" cy="285" r="8" fill="#94a3b8" />
  <circle cx="320" cy="260" r="10" fill="#334155" />

  <!-- Pothole rim jagged fracture lines -->
  <path d="M 280,180 L 250,160 M 340,150 L 330,120 M 450,150 L 470,125 M 540,210 L 575,195 M 540,290 L 580,310 M 450,335 L 470,370 M 330,330 L 315,365 M 260,280 L 225,295" stroke="#1f2937" stroke-width="3" stroke-linecap="round" />

  <!-- Engineering Measurement Scale (Calibration Ruler) -->
  <g transform="translate(260, 360)">
    <rect width="250" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Ruler markings -->
    <line x1="10" y1="0" x2="10" y2="12" stroke="#854d0e" stroke-width="2" />
    <line x1="60" y1="0" x2="60" y2="12" stroke="#854d0e" stroke-width="2" />
    <line x1="110" y1="0" x2="110" y2="12" stroke="#854d0e" stroke-width="2" />
    <line x1="160" y1="0" x2="160" y2="12" stroke="#854d0e" stroke-width="2" />
    <line x1="210" y1="0" x2="210" y2="12" stroke="#854d0e" stroke-width="2" />
    <text x="125" y="16" font-family="monospace" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">ESTIMATED DEPTH: 16cm | WIDTH: 62cm</text>
  </g>

  <!-- Watermark / Demo Evidence Label -->
  <g transform="translate(20, 20)">
    <rect width="360" height="30" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">
      DEMO EVIDENCE • ROAD DISTRESS TEST CASE
    </text>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(20, 410)">
    <rect width="520" height="26" rx="5" fill="#020617" fill-opacity="0.85" />
    <text x="12" y="18" font-family="monospace" font-size="11" fill="#94a3b8">
      LOC: 29.0021° N, 77.7215° E • MEERUT–PAURI ODR • IRC:82 DISTRESS CLASSIFICATION
    </text>
  </g>
</svg>
