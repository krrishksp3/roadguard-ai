<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="asphaltGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="60%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
    <pattern id="alligatorSkin" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0,20 L 30,0 L 60,20 L 30,40 Z" fill="none" stroke="#030712" stroke-width="2" />
      <path d="M 30,0 L 30,40" fill="none" stroke="#030712" stroke-width="1.5" />
      <path d="M 0,20 L 60,20" fill="none" stroke="#030712" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Pavement Base -->
  <rect width="800" height="450" fill="url(#asphaltGradient)" />

  <!-- Center dashed line -->
  <rect x="390" y="0" width="14" height="100" fill="#ffffff" opacity="0.6" />
  <rect x="390" y="160" width="14" height="100" fill="#ffffff" opacity="0.6" />
  <rect x="390" y="320" width="14" height="100" fill="#ffffff" opacity="0.6" />

  <!-- Alligator fatigue cracking zones -->
  <rect x="180" y="120" width="220" height="220" fill="url(#alligatorSkin)" opacity="0.85" />
  <rect x="440" y="160" width="180" height="180" fill="url(#alligatorSkin)" opacity="0.75" />

  <!-- Primary Longitudinal Structural Fissure -->
  <path d="M 280,30 Q 310,120 270,210 T 320,380 L 300,450" fill="none" stroke="#020617" stroke-width="6" stroke-linecap="round" />
  <path d="M 280,30 Q 310,120 270,210 T 320,380 L 300,450" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

  <!-- Secondary branching cracks -->
  <path d="M 295,140 Q 350,160 410,150 T 490,170" fill="none" stroke="#030712" stroke-width="3" />
  <path d="M 270,210 Q 210,230 150,220 T 90,260" fill="none" stroke="#030712" stroke-width="3.5" />
  <path d="M 300,280 Q 360,300 420,290" fill="none" stroke="#030712" stroke-width="2.8" />
  <path d="M 315,350 Q 240,360 190,390" fill="none" stroke="#030712" stroke-width="3" />
  <path d="M 450,180 Q 520,210 590,200" fill="none" stroke="#030712" stroke-width="2.5" />

  <!-- Crack Width Gauge Overlay -->
  <g transform="translate(480, 240)">
    <rect width="210" height="34" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="17" r="6" fill="#ef4444" />
    <text x="35" y="21" font-family="monospace" font-size="11" font-weight="bold" fill="#fca5a5">
      FISSURE APERTURE: 14mm
    </text>
  </g>

  <!-- Watermark / Demo Evidence Label -->
  <g transform="translate(20, 20)">
    <rect width="360" height="30" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">
      DEMO EVIDENCE • ROAD DISTRESS TEST CASE
    </text>
  </g>

  <!-- Technical Telemetry Footer -->
  <g transform="translate(20, 410)">
    <rect width="550" height="26" rx="5" fill="#020617" fill-opacity="0.85" />
    <text x="12" y="18" font-family="monospace" font-size="11" fill="#94a3b8">
      LOC: 28.9310° N, 77.6480° E • SALEMPUR ROAD • LONGITUDINAL & FATIGUE CRACKING
    </text>
  </g>
</svg>
